# Kotlin's incremental compiler cache trips on relative-path
# resolution when the pub cache and project live on different
# Windows drive letters (fails as "Daemon compilation failed: null" /
# "Could not close incremental caches"). Disabling incremental
# compilation avoids it.
kotlin.incremental=false
