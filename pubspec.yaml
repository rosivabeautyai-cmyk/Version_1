name: rosivia
description: "AI Beauty Assistant with Affiliate Marketing"

publish_to: 'none'

version: 1.0.0+23

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.5

  # State Management
  provider: ^6.1.5

  # AI & Voice
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3

  # Networking
  http: ^1.5.0

  # Images
  cached_network_image: ^3.4.1

  # Fonts & UI
  google_fonts: ^6.3.1
  flutter_screenutil: ^5.9.3

  # Localization
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.5.3

  # Icons
  flutter_svg: ^2.2.0

  # URL Launcher
  url_launcher: ^6.3.2

  # Sharing (product details "Share" button)
  share_plus: ^12.0.0

  # Loading Animations
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher / favicon icon generation only (not bundled at runtime).
  flutter_launcher_icons: ^0.14.3
  # Used once by tool/make_app_icon.dart to prep a clean icon source.
  image: ^4.3.0

# Generates ONLY the OS-level application icon (Android launcher +
# adaptive, iOS AppIcon, web favicon / PWA icons). Does not touch splash
# screens or any in-app imagery. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/rosiva_app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/rosiva_app_icon_fg.png"
  adaptive_icon_foreground_inset: 10
  web:
    generate: true
    image_path: "assets/branding/rosiva_app_icon.png"

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/image/
    - assets/icons/

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf

    - family: PlayfairDisplaySC
      fonts:
        - asset: assets/fonts/PlayfairDisplaySC-Regular.ttf