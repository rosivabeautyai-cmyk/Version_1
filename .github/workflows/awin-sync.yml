name: Awin product sync

# Syncs the Awin product feed into Firestore. Runs entirely on GitHub
# Actions (not Firebase Cloud Functions), so it needs no Firebase
# Blaze plan and no Firebase Functions secrets — only GitHub repo
# secrets. See scripts/awin-sync/ for the actual sync logic.

on:
  workflow_dispatch: {}
  schedule:
    # 03:00 UTC every day. Adjust as needed — this is just a default.
    - cron: "0 3 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/awin-sync/package-lock.json

      - name: Install dependencies
        working-directory: scripts/awin-sync
        run: npm ci

      - name: Run Awin sync
        working-directory: scripts/awin-sync
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync
